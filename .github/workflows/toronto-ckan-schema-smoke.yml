name: Toronto CKAN source schema smoke (PR only)
on:
  pull_request:
    paths:
      - 'gta_toronto_ckan_schema_probe.py'
      - 'gta_toronto_permit_evidence.py'
      - '.github/workflows/toronto-ckan-schema-smoke.yml'
  workflow_dispatch:

# No schedule, credentials, production collection, source scraping or contacts.
permissions:
  contents: read

jobs:
  toronto-source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official CKAN package metadata, one row and exact permit filter only
        run: python gta_toronto_ckan_schema_probe.py --out toronto_ckan_connectivity_report.json
      - name: Preserve source connectivity report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toronto-ckan-schema-smoke
          path: toronto_ckan_connectivity_report.json
          if-no-files-found: warn
