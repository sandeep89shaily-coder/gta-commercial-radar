name: Live municipal collection evidence (no AI)
on:
  pull_request:
    paths:
      - 'gta_municipal_project_feed.py'
      - 'gta_toronto_open_data.py'
      - '.github/workflows/municipal-collection-live.yml'
  workflow_dispatch:
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test municipal feeds against public sources (no DeepSeek)
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          from gta_municipal_project_feed import run as municipal
          from gta_toronto_open_data import run as toronto
          path=os.path.join(os.environ["RUNNER_TEMP"],"GTA_RADAR_RESULTS")
          m=municipal(path)
          t=toronto(path)
          from gta_collection_truth import build as quality_acceptance
          q=quality_acceptance(path)
          print("COLLECTION_ACCEPTANCE",json.dumps({k:q.get(k) for k in (
              "total_source_rows","unique_application_files","unique_project_only_signals",
              "excluded_inactive_or_closed","new_or_changed_commercial_manual_review",
              "cities_with_application_files","cities_with_only_project_signals",
              "cities_without_any_project_signal")}))
          print("CITY_SOURCE_RESULTS")
          for item in m["source_status"]:
              print(json.dumps({k:item.get(k) for k in ("city","state","configured_pages","pages_fetched","application_id_rows","project_only_signals","new_or_changed","failures")}))
          print("TORONTO_CKAN",json.dumps(t))
          # Public alternative-source policy probe, no prohibited fetch.
          from robots_policy import evaluate
          from urllib.parse import urlparse
          import requests
          probes={
             "KITCHENER_ARCGIS_HUB_CSV":"https://opendata.arcgis.com/datasets/b7e2f8feda7340eaa5f4dd7b9c4d5ac0_0.csv",
             "KITCHENER_HUB_DOWNLOAD":"https://hub.arcgis.com/api/v3/datasets/b7e2f8feda7340eaa5f4dd7b9c4d5ac0_0/downloads/data?format=csv",
             "GUELPH_OFFICIAL_FEED":"https://guelph.ca/feed/",
             "GUELPH_ARCGIS_METADATA":"https://www.arcgis.com/sharing/rest/content/items/e66bd026b90e4faaae2d81b7319a0ad6/data?f=json"
          }
          for label,url in probes.items():
              try:
                  session=requests.Session()
                  session.trust_env=False
                  session.headers["User-Agent"]="GTARadarPublicSourceProbe/1.0"
                  allowed,reason=evaluate(session,url,"GTARadarPublicSourceProbe/1.0",timeout=5)
                  status={"source":label,"robots_allowed":allowed,"policy":reason}
                  if allowed:
                      r=session.get(url,timeout=(5,9),stream=True,allow_redirects=False)
                      status.update(http_status=r.status_code,
                            content_type=r.headers.get("Content-Type",""),
                            host=urlparse(r.url).hostname)
                      r.close()
                  print("SOURCE_PROBE",json.dumps(status))
              except Exception as exc:
                  print("SOURCE_PROBE",json.dumps({"source":label,
                        "error":type(exc).__name__+":"+str(exc)[:130]}))
          # Diagnostic only: identify whether Halton's public HTML contains
          # server-rendered table records or requires a separate data source.
          from gta_early_applications import _fetch
          from bs4 import BeautifulSoup
          try:
              page=_fetch("https://www.haltonhills.ca/developmentproposalsunderreview")
              soup=BeautifulSoup(page,"html.parser")
              print("HALTON_HTML",json.dumps({
                  "bytes":len(page),"tr":len(soup.find_all("tr")),
                  "table":len(soup.find_all("table")),
                  "file_numbers_in_html":page.upper().count("D11SPA"),
                  "table_sample":[tr.get_text(" ",strip=True)[:220]
                                  for tr in soup.find_all("tr")[:3]]}))
              print("HALTON_EMBEDS",json.dumps({
                  "iframes":[{"src":e.get("src"),"title":e.get("title")}
                             for e in soup.find_all("iframe")[:10]],
                  "possible_data_links":[{"text":a.get_text(" ",strip=True)[:80],
                       "href":a.get("href")} for a in soup.find_all("a",href=True)
                       if any(v in (a.get("href") or "").lower()
                              for v in ("development","application","arcgis","dashboard"))][:30],
                  "script_src":[sc.get("src") for sc in soup.find_all("script",src=True)[-12:]]}))
          except Exception as exc:
              print("HALTON_HTML_ERROR",type(exc).__name__,str(exc)[:160])
          for alternative in (
              "https://www.burlington.ca/en/news/current-development-projects.aspx",
              "https://www.burlington.ca/en/news/current-development-projects/1376-1382-plains-rd-e.aspx"):
              try:
                  body=_fetch(alternative)
                  print("BURLINGTON_ALTERNATIVE",json.dumps({"url":alternative,"bytes":len(body),
                      "file_number_count":body.lower().count("file numbers")}))
              except Exception as exc:
                  print("BURLINGTON_ALTERNATIVE_FAILED",json.dumps({"url":alternative,
                      "error":type(exc).__name__+":"+str(exc)[:160]}))
          # Decode small public metadata documents without following external
          # redirects or collecting personal information.
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          for label,url in (
              ("GUELPH_RSS","https://guelph.ca/feed/"),
              ("GUELPH_PLANNING_RSS","https://guelph.ca/category/city-government/planning-and-development/active-development-files/feed/"),
              ("GUELPH_EXPERIENCE","https://www.arcgis.com/sharing/rest/content/items/e66bd026b90e4faaae2d81b7319a0ad6/data?f=json"),
              ("KITCHENER_CSV","https://opendata.arcgis.com/datasets/b7e2f8feda7340eaa5f4dd7b9c4d5ac0_0.csv"),
              ("KITCHENER_HUB_PAGE","https://open-kitchenergis.opendata.arcgis.com/datasets/b7e2f8feda7340eaa5f4dd7b9c4d5ac0_0/explore")):
              try:
                  sess=requests.Session();sess.trust_env=False
                  sess.headers.update({"User-Agent":"GTARadarPublicSourceProbe/1.0"})
                  ok,why=evaluate(sess,url,"GTARadarPublicSourceProbe/1.0",timeout=5)
                  if not ok:
                      print("OFFICIAL_ALTERNATIVE",json.dumps({"source":label,"status":"POLICY_BLOCK","reason":why}))
                      continue
                  resp=sess.get(url,timeout=(5,10),stream=True,allow_redirects=False)
                  result={"source":label,"status":resp.status_code,"type":resp.headers.get("Content-Type",""),
                      "redirect":resp.headers.get("Location","")[:250]}
                  if resp.status_code==200:
                      body=resp.raw.read(1500000,decode_content=True)
                      if label.startswith("GUELPH") and "RSS" in label:
                          tree=ET.fromstring(body)
                          result["titles"]=[x.text[:120] for x in tree.findall(".//item/title")
                                            if x.text][:30]
                          result["links"]=[x.text for x in tree.findall(".//item/link")
                                           if x.text][:10]
                      if label=="GUELPH_EXPERIENCE":
                          data=json.loads(body)
                          textblob=json.dumps(data)
                          result["source_refs"]=[v[:200] for v in
                             set(re.findall(r"https?://[^\\\"\\s]+(?:FeatureServer|MapServer)[^\\\"\\s]*",textblob))][:12]
                          result["metadata_keys"]=list(data)[:20]
                  resp.close()
                  print("OFFICIAL_ALTERNATIVE",json.dumps(result))
              except Exception as e:
                  print("OFFICIAL_ALTERNATIVE",json.dumps({"source":label,"error":str(e)[:150]}))
          print("No paid AI calls made.")
          PY
      - name: Upload raw source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: municipal-collection-evidence
          path: |
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_MUNICIPAL_PROJECT_FEED_STATUS.json
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_MUNICIPAL_PROJECT_FEED.csv
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_TORONTO_OPEN_DATA_STATUS.json
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_TORONTO_OPEN_DATA_APPLICATIONS.csv
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_COLLECTION_ACCEPTANCE.json
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_COLLECTION_MASTER.csv
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_COLLECTION_NEW_OR_CHANGED_REVIEW.csv
            ${{ runner.temp }}/GTA_RADAR_RESULTS/GTA_RADAR_COLLECTION_HEALTH.csv
          if-no-files-found: warn
