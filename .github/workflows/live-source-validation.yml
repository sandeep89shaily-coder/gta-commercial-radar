name: Real public source verification (no AI)
on:
  workflow_dispatch:
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe real Brampton official project (robots-safe; no paid API)
        run: python gta_live_source_validation.py --out live_source_validation.json
      - name: Save evidence and failure reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-source-validation
          path: live_source_validation.json
          if-no-files-found: warn
