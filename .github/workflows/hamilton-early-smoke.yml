name: Hamilton early public sources one-shot check
on:
  workflow_dispatch:
  push:
    branches:
      - "dev/hamilton-live-check-*"
permissions:
  contents: read
jobs:
  hamilton:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Radar public parser dependencies
        run: python -m pip install -r requirements.txt
      - name: One-time official Hamilton GIS and published notice test
        run: python early_hamilton_watch.py --data-dir hamilton_smoke_data --output-dir hamilton_smoke_reports --max-notice-details 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hamilton-early-source-smoke
          path: hamilton_smoke_reports/EARLY_HAMILTON_SOURCE_STATUS.csv
          retention-days: 3
          if-no-files-found: warn
