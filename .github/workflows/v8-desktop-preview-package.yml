name: Build desktop early-cue preview ZIP
on:
  push:
    branches:
      - 'dev/integrate-early-feeds-v8-20261024'
    paths:
      - desktop_v8_early_preview.py
      - RUN_V8_EARLY_PREVIEW.bat
      - DESKTOP_V8_EARLY_PREVIEW_README.md
      - tests/test_desktop_v8_early_preview.py
      - .github/workflows/v8-desktop-preview-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify preview backup safety
        run: python -m unittest discover -s tests -p test_desktop_v8_early_preview.py
      - name: Build tested ZIP from this exact development commit
        run: |
          zip -q -r GTA_RADAR_V8_EARLY_DESKTOP_PREVIEW.zip . \
            -x ".git/*" ".github/*" "data/*" "GTA_RADAR_RESULTS/*" \
            "**/__pycache__/*" "**/*.pyc" "*.sqlite" "*.sqlite-wal" "*.sqlite-shm"
          unzip -t GTA_RADAR_V8_EARLY_DESKTOP_PREVIEW.zip | tail -1
          unzip -Z1 GTA_RADAR_V8_EARLY_DESKTOP_PREVIEW.zip | grep -Fx 'RUN_V8_EARLY_PREVIEW.bat'
      - uses: actions/upload-artifact@v4
        with:
          name: gta-radar-v8-early-desktop-preview
          path: GTA_RADAR_V8_EARLY_DESKTOP_PREVIEW.zip
          retention-days: 14
