name: Remaining municipal source probes (no AI)
on:
  pull_request:
    paths:
      - '.github/workflows/remaining-municipal-sources.yml'
      - 'gta_burlington_gis.py'
      - 'gta_york_region_gis.py'
  workflow_dispatch:
jobs:
  source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Official permitted source diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from robots_policy import evaluate
          import requests,json
          SOURCES={
            "BURLINGTON_GIS":"https://mapping.burlington.ca/arcgisweb/rest/services/COB/Development_Apps/MapServer/0",
            "YORK_REGION_GIS":"https://services1.arcgis.com/GzvOwaQBbX7KLiuG/ArcGIS/rest/services/Hosted_Development_Application_Status_And_Teams/FeatureServer/0",
            "KITCHENER_OFFICIAL_GIS":"https://services1.arcgis.com/qAo1OsXi67t7XgmS/ArcGIS/rest/services/Planning_Applications_Active/FeatureServer/0",
            "BURLINGTON_HUB":"https://navburl-burlington.opendata.arcgis.com/datasets/Burlington::burlington-development-application-summary-tables-2025-2026",
            "GROWTH_ACTIVE_DEV":"https://services6.arcgis.com/hM5ymMLbxIyWTjn2/ArcGIS/rest/services/Growth_Management_%E2%80%93_Active_Development_Applications/FeatureServer/0"
          }
          for name,url in SOURCES.items():
              session=requests.Session();session.trust_env=False
              session.headers["User-Agent"]="GTARadarPublicSourceProbe/1.0"
              report={"source":name}
              try:
                  ok,why=evaluate(session,url,"GTARadarPublicSourceProbe/1.0",timeout=5)
                  report.update(robots_allowed=ok,policy=why)
                  if ok:
                      params={"f":"json"} if "GIS" in name or name=="GROWTH_ACTIVE_DEV" else {}
                      resp=session.get(url,params=params,timeout=(6,12),
                                       allow_redirects=False,stream=True)
                      report.update(http=resp.status_code,
                                    content_type=resp.headers.get("Content-Type",""),
                                    location=resp.headers.get("Location","")[:150])
                      if resp.status_code==200 and "json" in resp.headers.get("Content-Type","").lower():
                          data=resp.json()
                          report["fields"]=[x.get("name") for x in data.get("fields",[])][:60]
                          report["objectIdField"]=data.get("objectIdField")
                          report["error"]=data.get("error")
                      resp.close()
              except Exception as exc:
                  report["error"]=type(exc).__name__+":"+str(exc)[:180]
              print("OFFICIAL_SOURCE",json.dumps(report))
          # Official Burlington GIS sample and Hub item metadata.
          urls={
            "BURLINGTON_PROJECT_SAMPLE":"https://mapping.burlington.ca/arcgisweb/rest/services/COB/Development_Apps/MapServer/0/query",
            "BURLINGTON_HUB_ITEM":"https://www.arcgis.com/sharing/rest/content/items/c32a534bab8e48ebb9a7575e4a6ace7a",
            "BURLINGTON_HUB_DATA":"https://www.arcgis.com/sharing/rest/content/items/c32a534bab8e48ebb9a7575e4a6ace7a/data"
          }
          for name,url in urls.items():
              ss=requests.Session();ss.trust_env=False
              ss.headers["User-Agent"]="GTARadarPublicSourceProbe/1.0"
              result={"source":name}
              try:
                  ok,why=evaluate(ss,url,"GTARadarPublicSourceProbe/1.0",timeout=6)
                  result["allowed"]=ok;result["policy"]=why
                  if ok:
                      params={"f":"json"}
                      if name=="BURLINGTON_PROJECT_SAMPLE":
                          params.update(where="1=1",outFields="*",returnGeometry="false",
                                        resultRecordCount="3")
                      rr=ss.get(url,params=params,timeout=(6,13),allow_redirects=False,stream=True)
                      result["http"]=rr.status_code
                      if rr.status_code==200:
                          data=rr.json()
                          if name=="BURLINGTON_PROJECT_SAMPLE":
                              result["features"]=[f.get("attributes") for f in data.get("features",[])][:3]
                          else:
                              result["metadata"]={k:data.get(k) for k in ("type","title","url","typeKeywords","description","access")}
                              result["data_preview"]=str(data)[:1100] if name=="BURLINGTON_HUB_DATA" else ""
                      rr.close()
              except Exception as e:
                  result["error"]=str(e)[:170]
              print("BURLINGTON_DETAIL",json.dumps(result)[:4500])
          # Town's official ArcGIS catalog provides a public ZIP of planning
          # application summary tables. Only read if permitted and bounded.
          import io,zipfile
          url="https://mapping.burlington.ca/docs/Burlington%20Development%20Application%20Summary%20Tables.zip"
          session=requests.Session();session.trust_env=False
          session.headers["User-Agent"]="GTARadarPublicSourceProbe/1.0"
          report={"source":"BURLINGTON_OFFICIAL_SUMMARY_ZIP"}
          try:
              ok,why=evaluate(session,url,"GTARadarPublicSourceProbe/1.0",timeout=6)
              report.update(allowed=ok,policy=why)
              if ok:
                  response=session.get(url,timeout=(6,16),stream=True,allow_redirects=False)
                  report["http"]=response.status_code
                  report["content_type"]=response.headers.get("Content-Type")
                  report["length"]=response.headers.get("Content-Length")
                  if response.status_code==200:
                      body=bytearray()
                      for part in response.iter_content(32768):
                          body.extend(part)
                          if len(body)>4000000:raise ValueError("BURLINGTON_ZIP_TOO_LARGE")
                      if zipfile.is_zipfile(io.BytesIO(body)):
                          z=zipfile.ZipFile(io.BytesIO(body))
                          report["members"]=[{"name":v.filename,"bytes":v.file_size}
                                             for v in z.infolist()][:25]
                          preview=[]
                          for item in z.infolist():
                              if item.filename.lower().endswith((".csv",".txt")) and item.file_size<500000:
                                  preview.append({"name":item.filename,
                                      "head":z.read(item).decode("utf-8-sig","replace")[:1100]})
                          report["preview"]=preview[:3]
                  response.close()
          except Exception as exc:
              report["error"]=type(exc).__name__+":"+str(exc)[:190]
          print("OFFICIAL_BURLINGTON_ZIP",json.dumps(report)[:5500])
          from gta_burlington_gis import run as burlington_run
          import os
          root=os.path.join(os.environ["RUNNER_TEMP"],"burlington_source")
          print("BURLINGTON_COLLECTOR",json.dumps(burlington_run(root)))
          PY
