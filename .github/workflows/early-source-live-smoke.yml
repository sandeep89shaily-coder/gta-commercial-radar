name: Early public source live health (one-shot)
on:
  workflow_dispatch:
  push:
    branches:
      - "dev/live-early-source-probe-*"
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe only bounded official public indexes
        run: python early_live_source_probe.py --output-dir source_health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gta-early-live-source-health
          path: source_health/EARLY_LIVE_SOURCE_HEALTH_ONLY.csv
          if-no-files-found: warn
          retention-days: 7
