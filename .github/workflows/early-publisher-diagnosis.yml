name: Early collector publisher diagnosis (one shot)
on:
  workflow_dispatch:
  push:
    branches:
      - "dev/early-source-diagnosis-*"
permissions:
  contents: read
jobs:
  public-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/early_publisher_diagnostic.py
