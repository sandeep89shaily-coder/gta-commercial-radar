name: Official CSV export alternatives - no access bypass
on:
  pull_request:
    paths: ['gta_official_download_discovery.py','.github/workflows/official-download-discovery.yml']
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python gta_official_download_discovery.py
