name: Radar tests
on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest test run for the same branch or PR.
concurrency:
  group: radar-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Syntax-compile every Python file
        run: python -m compileall -q .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests
