name: Disabled source sample audit
on:
  push:
    branches:
      - 'dev/integrate-early-feeds-v8-20261024'
    paths:
      - 'disabled_source_sample_audit.py'
      - 'tests/test_disabled_source_sample_audit.py'
      - '.github/workflows/disabled-source-sample-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Check up to three rows per disabled source
        run: python disabled_source_sample_audit.py --output source-audit/DISABLED_SOURCE_SAMPLE_AUDIT.csv
      - uses: actions/upload-artifact@v4
        with:
          name: disabled-source-sample-report
          path: source-audit/DISABLED_SOURCE_SAMPLE_AUDIT.csv
