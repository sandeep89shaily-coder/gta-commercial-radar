name: Disabled GTA Radar feeds safe acceptance
on:
  pull_request:
    paths: ['gta_disabled_feed_acceptance.py','tests/test_disabled_feed_acceptance.py','.github/workflows/disabled-feeds-acceptance.yml','config/sources.json']
  workflow_dispatch:
jobs:
  probe-14:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python gta_disabled_feed_acceptance.py --output disabled_feed_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disabled-feed-source-acceptance
          path: disabled_feed_audit/*
          if-no-files-found: warn
