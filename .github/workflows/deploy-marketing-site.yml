name: Deploy GTA Radar marketing website

# Manual publish only: the public-facing brand/domain and sample-report backend
# are not finalized. No automated site publication on a main-branch push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gta-radar-marketing-pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website assets
        run: python3 -m unittest discover -s tests -p test_marketing_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
